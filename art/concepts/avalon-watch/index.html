<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Свет Авалона · Макеты интерфейса</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1725;color:#ffe3ad;font:16px system-ui,sans-serif}header,main,footer{max-width:1460px;margin:auto;padding:16px 24px}
header{border-bottom:1px solid #70533d;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font:26px Georgia,serif;margin:0;color:#ffc671}
nav{display:flex;flex-wrap:wrap;gap:16px}a{color:#bedada}label{font-size:14px;color:#c3cfd9;display:grid;gap:4px}
.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap}button,select{color:#ffe3ad;background:#19324b;border:1px solid #677887;padding:8px;font:inherit;border-radius:3px}
button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #ffc671;outline-offset:3px}
figure{display:grid;place-items:center;margin:16px 0 0;background:#07111c;padding:8px}img{display:block;width:auto;height:auto;max-width:100%;max-height:78vh;image-rendering:pixelated}figcaption{padding:8px;text-align:center;color:#c3cfd9}footer{font-size:14px} @media(max-width:640px){header,main,footer{padding:10px}.controls{gap:6px}select{max-width:95vw}}
</style><header><h1>Свет Авалона · Береговая вахта</h1><nav><a href="README.md">Стандарт</a><a href="reference/source-1x.png">Меню 1:1</a><a href="sprites/components.png">Компоненты</a><a href="overview.png">Обзор</a></nav></header>
<main><div class="controls"><label>Экран<select id="screen"><option value="menu">Главное меню · браузер</option><option value="game-menu">Выбор игры</option><option value="game-menu-new">Выбор игры · первый запуск</option><option value="confirm-new">Подтверждение новой игры</option><option value="settings">Настройки</option><option value="settings-error">Ошибка сохранения настроек</option><option value="chronicle">Хроника · выбор ночи</option><option value="chronicle-chapters">Хроника · оглавление</option><option value="trials">Испытания прототипа · доступно</option><option value="trials-locked">Испытания прототипа · закрыто</option><option value="upgrades">Древо · доступная покупка</option><option value="upgrades-locked">Древо · требования</option><option value="collection">Коллекция · получение</option><option value="collection-equipped">Коллекция · оформление</option><option value="reward-offer">Добровольная награда · основной запуск</option><option value="reward-test">Добровольная награда · тестовое подтверждение</option><option value="intro-1">Вступление · глава 1</option><option value="intro-2">Вступление · глава 2</option><option value="intro-3">Вступление · глава 3</option><option value="intro-4">Вступление · глава 4</option><option value="intro-5">Вступление · глава 5</option><option value="intro-6">Вступление · глава 6</option><option value="intro-7">Вступление · глава 7</option><option value="intro-replay">Повтор вступления</option><option value="victory">Победа</option><option value="defeat">Поражение</option><option value="epilogue">Эпилог · победа над Сердцем тумана</option><option value="result-error">Ошибка записи результата</option><option value="preparation">Подготовка</option><option value="prep-catalog">Устройства и обслуживание</option><option value="prep-lens">Выбор линзы</option><option value="prep-ability">Выбор способности</option><option value="prep-recon">Разведка ночи</option><option value="prep-currency">Пополнение осколков</option><option value="placement-invalid">Недопустимая позиция</option><option value="placement-move">Перенос экземпляра</option><option value="battle">Бой</option><option value="battle-boss">Бой со Стражем глубин</option><option value="battle-device">Команды пушки</option><option value="pause">Пауза</option><option value="abandon">Прерывание ночи</option></select></label><label>Устройство<select id="device"><option value="desktop">ПК</option><option value="landscape">Телефон горизонтально</option><option value="portrait">Телефон вертикально</option></select></label><label>Язык<select id="lang"><option>RU</option><option>EN</option></select></label><label>Текст<select id="size"><option value="normal">Обычный</option><option value="large">Крупный</option></select></label><button id="prev" aria-label="Предыдущий экран">←</button><button id="next" aria-label="Следующий экран">→</button></div><figure><a id="link"><img id="image" alt=""></a><figcaption id="caption"></figcaption></figure></main>
<footer><nav><a id="compare">Сравнение с главным меню</a><a href="comparisons/">Все сравнительные листы</a><a href="sprites/ui.json">Размеры и 9-slice</a></nav></footer>
<script>
const el=s=>document.getElementById(s), screen=el('screen'), device=el('device'), lang=el('lang'), size=el('size');
function draw(){
  const main=screen.value==='menu', d=device.value, variant=lang.value.toLowerCase()+'-'+size.value;
  const path=main?'reference/'+d+'.png':'mockups/'+variant+'/'+d+'/'+screen.value+'.png';
  const title=screen.selectedOptions[0].textContent;
  lang.disabled=size.disabled=main;
  el('image').src=el('link').href=path;el('image').alt=title;
  const groups={"01-entry": ["menu", "game-menu-new", "game-menu", "confirm-new", "settings", "settings-error"], "02-records": ["menu", "preparation", "chronicle", "chronicle-chapters", "intro-replay", "intro-1"], "03-trials": ["menu", "game-menu", "trials-locked", "trials"], "04-economy": ["menu", "preparation", "upgrades", "upgrades-locked", "collection", "collection-equipped"], "05-coast": ["menu", "preparation", "battle", "placement-invalid", "placement-move", "battle-device"], "06-watch": ["menu", "battle", "pause", "battle-boss", "abandon", "defeat"], "07-dawn": ["menu", "victory", "epilogue", "result-error", "settings", "intro-7"], "08-chapters": ["intro-1", "intro-2", "intro-3", "intro-4", "intro-5", "intro-6", "intro-7", "epilogue"], "09-loadout": ["preparation", "prep-catalog", "prep-lens", "prep-ability", "prep-recon", "prep-currency"], "10-rewards": ["menu", "collection", "reward-offer", "reward-test"]};
  let group=Object.keys(groups).find(k=>groups[k].includes(screen.value))||'01-entry';
  el('compare').href='comparisons/'+d+'/'+group+'.png';
  el('caption').textContent=title+' · '+({desktop:'1280 × 720',landscape:'720 × 360',portrait:'360 × 640'})[d]+(main?' · RU, обычный':' · '+lang.value+', '+size.selectedOptions[0].textContent.toLowerCase());
}
for(const select of [screen,device,lang,size])select.onchange=draw;
function step(k){screen.selectedIndex=(screen.selectedIndex+k+screen.length)%screen.length;draw()}
el('prev').onclick=()=>step(-1);el('next').onclick=()=>step(1);draw();
</script></html>
