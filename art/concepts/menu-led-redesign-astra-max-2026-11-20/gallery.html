<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Свет Авалона · просмотр макетов</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b29;color:#e9dfc9;font:15px system-ui,sans-serif}header{padding:12px 18px;background:#15283b;border-bottom:1px solid #4b5d68;display:flex;align-items:end;flex-wrap:wrap;gap:9px 17px}label{display:grid;gap:4px;font-size:12px;color:#c1cbd0}select,button{background:#142638;color:#f6e5c5;border:1px solid #668090;border-radius:3px;padding:6px;font:inherit;min-height:33px}select:focus,button:focus,a:focus{outline:2px solid #ffcb89}main{padding:12px 16px;overflow:auto}img{display:block;image-rendering:pixelated;max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;object-position:top left;width:auto;height:auto}.actual img{max-height:none;max-width:none}a{color:#f8c386}span{align-self:center;color:#a7bac8}p{margin:7px 0 0}
</style><header><label>Материал<select id="kind"><option value="board">Макет</option><option value="sheet">Сравнительный лист</option></select></label>
<label>Экран<select id="scene"><option value="game-select">Выбор игры</option><option value="settings">Настройки</option><option value="chronicle-chapters">Хроника · оглавление</option><option value="chronicle-nights">Хроника · выбор ночи</option><option value="trials">Испытания прототипа</option><option value="story-01">Вступление · Туманный берег</option><option value="story-02">Вступление · Дальний берег</option><option value="story-03">Вступление · Терновые топи</option><option value="story-04">Вступление · Пепельные утёсы</option><option value="story-05">Вступление · Кладбище кораблей</option><option value="story-06">Вступление · Затмение Авалона</option><option value="story-07">Вступление · Последний рассвет</option><option value="preparation">Подготовка · карта</option><option value="devices">Устройства · магазин</option><option value="lens">Оснащение · линза</option><option value="ability">Оснащение · способность</option><option value="placement">Расстановка экземпляра</option><option value="service">Обслуживание экземпляра</option><option value="invalid-placement">Позиция за границей суши</option><option value="scouting">Разведка</option><option value="currency">Осколки и недоступное видео</option><option value="development">Развитие кампании</option><option value="prototype-tree">Древо улучшений прототипа</option><option value="purchase">Покупка</option><option value="purchase-locked">Покупка · нехватка средств</option><option value="collection">Коллекция · получение награды</option><option value="battle">Бой · угрозы и цели</option><option value="boss">Бой · Страж глубин</option><option value="device-command">Бой · команда пушки</option><option value="target-ability">Бой · выбор цели Печати</option><option value="pause">Пауза</option><option value="confirm-abandon">Подтверждение прерывания</option><option value="victory">Победа</option><option value="defeat">Поражение после гибели босса</option><option value="epilogue">Эпилог и итог финальной ночи</option><option value="confirm-new">Подтверждение новой игры</option><option value="save-error">Ошибка сохранения результата</option><option value="reload-confirm">Подтверждение перечитывания</option><option value="settings-error">Ошибка записи настроек</option><option value="profile-lock">Профиль открыт в другой вкладке</option><option value="interrupted">Возврат после прерывания</option><option value="reward-test">Подтверждение на стенде видеонаград</option><option value="new-profile">Выбор игры · новый профиль</option><option value="prototype-select">Выбор игры · профиль прототипа</option><option value="trial-modes">Разведка · режим испытания прототипа</option><option value="battle-shield">Бой · общее поле генераторов</option><option value="story-replay">Пересмотр вступления из Хроники</option></select></label><label hidden id="sheetLabel">Переход<select id="sheet"><option value="navigation">navigation</option><option value="chronicle">chronicle</option><option value="journal-first">journal-first</option><option value="journal-coasts">journal-coasts</option><option value="landfall">landfall</option><option value="equipment">equipment</option><option value="maintenance">maintenance</option><option value="upgrades">upgrades</option><option value="rewards">rewards</option><option value="combat">combat</option><option value="defense">defense</option><option value="outcomes">outcomes</option><option value="decisions">decisions</option><option value="recovery">recovery</option><option value="return">return</option><option value="prototype">prototype</option><option value="battle-states">battle-states</option><option value="replay">replay</option></select></label>
<label>Окно<select id="device"><option value="desktop">ПК 1280 × 720</option><option value="phone-landscape">Телефон 844 × 390</option><option value="phone-portrait">Телефон 390 × 844</option></select></label>
<label id="viewLabel">Подписи<select id="variant"><option value="ru-normal">Русский · обычные</option><option value="ru-large">Русский · крупные</option><option value="en-normal">English · обычные</option><option value="en-large">English · крупные</option></select></label>
<button id="size" aria-pressed="false">Масштаб 1:1</button><a id="original" target="_blank">Открыть PNG</a></header>
<main><img id="frame" alt="Макет игры"><p id="info"></p></main>
<script>
const el=id=>document.getElementById(id);
function paint(){
 const isSheet=el('kind').value==='sheet', dev=el('device').value, mode=el('variant').value;
 el('scene').parentElement.style.display=isSheet?'none':'grid';el('sheetLabel').style.display=isSheet?'grid':'none';el('viewLabel').style.display=isSheet?'none':'grid';
 const path=isSheet?'sheets/'+dev+'/'+el('sheet').value+'.png':(mode==='ru-normal'?'boards':'locales/'+mode)+'/'+dev+'/'+el('scene').value+'.png';
 el('frame').src=path;el('original').href=path;el('frame').alt=(isSheet?'Сравнение ':'Экран ')+(isSheet?el('sheet'):el('scene')).selectedOptions[0].text;
 el('frame').onload=()=>el('info').textContent=el('frame').naturalWidth+' × '+el('frame').naturalHeight+' px';
}for(const c of document.querySelectorAll('select'))c.addEventListener('change',paint);
el('size').addEventListener('click',()=>{const on=document.body.classList.toggle('actual');el('size').setAttribute('aria-pressed',on);el('size').textContent=on?'Вписать в окно':'Масштаб 1:1'});paint();
</script></html>
