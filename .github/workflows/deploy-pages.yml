name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test game
        run: pnpm test

      - name: Check known legacy failures for regressions
        run: pnpm test:legacy:baseline

      - name: Audit balance
        run: pnpm test:audits

      - name: Build game
        run: pnpm build

      - name: Smoke-test the production battle on a Pages path
        timeout-minutes: 3
        shell: bash
        run: |
          google-chrome --version
          export LIGHTHOUSE_BROWSER_PATH="$(mktemp)"
          trap 'rm -f -- "$LIGHTHOUSE_BROWSER_PATH"' EXIT
          cat > "$LIGHTHOUSE_BROWSER_PATH" <<'CHROME'
          #!/usr/bin/env bash
          exec google-chrome --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader "$@"
          CHROME
          chmod +x "$LIGHTHOUSE_BROWSER_PATH"
          node tools/browser/verify-pages-build.mjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
